apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: distrischool }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: distrischool/api-gateway:0.2
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: jwt-secret } }
            - { name: CORS_ORIGIN, value: "http://localhost:3000" }
            - { name: LOGIN_RATE_LIMIT, value: "20" }
            - { name: USER_SERVICE_URL, value: "http://user-service:3001" }
            - { name: STUDENT_SERVICE_URL, value: "http://student-service:3002" }
            - { name: STAFF_SERVICE_URL, value: "http://staff-service:3003" }
            - { name: ACADEMIC_SERVICE_URL, value: "http://academic-service:3004" }
            - { name: ADMINISTRATIVE_SERVICE_URL, value: "http://administrative-service:3005" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:3006" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: distrischool }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]

apiVersion: apps/v1
kind: Deployment
metadata: { name: __NAME__, namespace: distrischool }
spec:
  replicas: 2
  selector: { matchLabels: { app: __NAME__ } }
  template:
    metadata: { labels: { app: __NAME__ } }
    spec:
      containers:
        - name: __NAME__
          image: distrischool/__NAME__:0.1
          imagePullPolicy: Never
          ports: [{ containerPort: __PORT__ }]
          env:
            - { name: PORT, value: "__PORT__" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-password } }
            - { name: DATABASE_URL, value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/__DB__" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: jwt-secret } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: admin-email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: admin-password } }
          readinessProbe:
            httpGet: { path: /health, port: __PORT__ }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: __PORT__ }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: __NAME__, namespace: distrischool }
spec:
  selector: { app: __NAME__ }
  ports: [{ port: __PORT__, targetPort: __PORT__ }]
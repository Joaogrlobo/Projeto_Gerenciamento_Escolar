apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: distrischool }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-user } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-password } }
          startupProbe:
            exec: { command: [ "rabbitmq-diagnostics", "-q", "ping" ] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: [ "rabbitmq-diagnostics", "-q", "ping" ] }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [ "rabbitmq-diagnostics", "-q", "ping" ] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: distrischool }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }

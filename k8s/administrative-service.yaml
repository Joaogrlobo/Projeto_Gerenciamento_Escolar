apiVersion: apps/v1
kind: Deployment
metadata: { name: administrative-service, namespace: distrischool }
spec:
  replicas: 2
  selector: { matchLabels: { app: administrative-service } }
  template:
    metadata: { labels: { app: administrative-service } }
    spec:
      containers:
        - name: administrative-service
          image: distrischool/administrative-service:0.3
          imagePullPolicy: Never
          ports: [{ containerPort: 3005 }]
          env:
            - { name: PORT, value: "3005" }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-password } }
            - { name: DATABASE_URL, value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/administrative_db" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: jwt-secret } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-user } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-password } }
            - { name: RABBITMQ_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672" }
            - { name: STAFF_SERVICE_URL, value: "http://staff-service:3003" }
          readinessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: administrative-service, namespace: distrischool }
spec:
  selector: { app: administrative-service }
  ports: [{ port: 3005, targetPort: 3005 }]

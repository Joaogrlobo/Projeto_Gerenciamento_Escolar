apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: distrischool }
spec:
  replicas: 2
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: distrischool/user-service:0.1
          imagePullPolicy: Never
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-password } }
            - { name: DATABASE_URL, value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/users_db" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: jwt-secret } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: admin-email } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: admin-password } }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: distrischool }
spec:
  selector: { app: user-service }
  ports: [{ port: 3001, targetPort: 3001 }]

apiVersion: apps/v1
kind: Deployment
metadata: { name: academic-service, namespace: distrischool }
spec:
  replicas: 2
  selector: { matchLabels: { app: academic-service } }
  template:
    metadata: { labels: { app: academic-service } }
    spec:
      containers:
        - name: academic-service
          image: distrischool/academic-service:0.3
          imagePullPolicy: Never
          ports: [{ containerPort: 3004 }]
          env:
            - { name: PORT, value: "3004" }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-password } }
            - { name: DATABASE_URL, value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/academic_db" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: jwt-secret } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-user } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-password } }
            - { name: RABBITMQ_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672" }
            - { name: STUDENT_SERVICE_URL, value: "http://student-service:3002" }
            - { name: ADMINISTRATIVE_SERVICE_URL, value: "http://administrative-service:3005" }
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: academic-service, namespace: distrischool }
spec:
  selector: { app: academic-service }
  ports: [{ port: 3004, targetPort: 3004 }]

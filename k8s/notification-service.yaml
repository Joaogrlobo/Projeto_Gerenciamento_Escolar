apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: distrischool }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: distrischool/notification-service:0.2
          imagePullPolicy: Never
          ports: [{ containerPort: 3006 }]
          env:
            - { name: PORT, value: "3006" }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: postgres-password } }
            - { name: DATABASE_URL, value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/notification_db" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: jwt-secret } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-user } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: distrischool-secrets, key: rabbitmq-password } }
            - { name: RABBITMQ_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672" }
          readinessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3006 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: distrischool }
spec:
  selector: { app: notification-service }
  ports: [{ port: 3006, targetPort: 3006 }]
